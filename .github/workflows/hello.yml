name: Hello World Training Workflow

on:
  workflow_dispatch:
  issues:
    types: [opened, edited]

jobs:
  greet:
    env:
      MY_ENV: "John Doe"

    runs-on: ubuntu-latest
    steps:
      - name: Greet the User
        run: echo "Hello World!"
      
      - name: Going to list directory contents
        run: echo "Going to list the directory contents!"
      
      - run: ls -l
      
      - uses: actions/checkout@v5
      - run: ls -l
      
      - name: Run a multi-line script
        run: |
          echo "Hello $MY_ENV"
          echo "Hello $GITHUB_ACTOR"

      - name: 'Report Coverage'
          uses:  davelosert/vitest-coverage-report-action@v2
          if: always()
